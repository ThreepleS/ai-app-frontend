<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="theme-color" content="#1e3a5f" />
  <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <title>AI App</title>
  <style>
    :root { --bg: #0f1419; --panel: #1a2230; --accent: #1e3a5f; --text: #e6edf3; --muted: #8b98a5; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text);
           display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
    body.light { --bg: #f2f5f9; --panel: #ffffff; --accent: #1e3a5f; --text: #16202b; --muted: #5b6878; }
    header { flex: 0 0 auto; padding: 12px 16px; background: var(--accent); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    header b { font-size: 16px; }
    #log { font-size: 12px; color: var(--muted); flex: 1 1 auto; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    header .hbtn { border: 0; background: transparent; color: var(--text); font-size: 18px; cursor: pointer; padding: 2px 6px; }

    /* --- Кнопка выбора модели: векторная SVG-иконка нейросети --- */
    #models {
      position: relative; width: 34px; height: 34px; border: 0; background: transparent;
      cursor: pointer; padding: 4px; display: inline-flex; align-items: center; justify-content: center;
      overflow: visible;
    }
    #models .model-svg { width: 26px; height: 26px; display: block; }
    #models .ms-core {
      fill: url(#msGrad);
      filter: drop-shadow(0 0 3px rgba(80,160,255,.55));
      transition: filter .25s ease;
    }
    #models .ms-node { fill: #cfe6ff; }
    #models .ms-link { stroke: #5b9bff; stroke-width: 1.4; opacity: .8; }
    #models .ms-ring {
      fill: none; stroke: url(#msGrad); stroke-width: 2;
      stroke-dasharray: 60; stroke-dashoffset: 0;
      transform-origin: 16px 16px;
      animation: msSpin 6s linear infinite;
    }
    #models .ms-pulse {
      fill: none; stroke: #5b9bff; stroke-width: 1.5; opacity: 0;
      transform-origin: 16px 16px;
    }
    #models:hover .ms-core { filter: drop-shadow(0 0 7px rgba(120,180,255,.95)); }
    #models:active .ms-core { filter: drop-shadow(0 0 10px rgba(150,200,255,1)); }
    /* вспышка-пульс при клике */
    #models.ping .ms-pulse { animation: msPulse .55s ease-out; }
    @keyframes msSpin { to { transform: rotate(360deg); } }
    @keyframes msPulse {
      0%   { opacity: .9; transform: scale(.5); }
      100% { opacity: 0;  transform: scale(1.6); }
    }
    @media (prefers-reduced-motion: reduce) {
      #models .ms-ring { animation: none; }
    }
    #s_admin { font-size: 13px; color: #fff; text-decoration: none; background: #2a6f4f; padding: 10px 18px; border-radius: 10px; }
    #messages { flex: 1 1 auto; padding: 16px 16px 8px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
    .msg { padding: 10px 14px; border-radius: 12px; max-width: 100%; line-height: 1.5; overflow-wrap: anywhere; }
    .msg.user { background: var(--accent); align-self: flex-end; }
    .msg.bot { background: var(--panel); align-self: flex-start; }
    .msg pre { background: #0b0f14; padding: 10px; border-radius: 8px; overflow: auto; position: relative; }
    body.light .msg pre { background: #0b0f14; }
    .msg code { background: #0b0f14; padding: 1px 5px; border-radius: 4px; }
    .code-wrap { position: relative; }
    .code-copy { position: absolute; top: 6px; right: 6px; z-index: 2; border: 0; background: #2a3a4f; color: #fff;
                  width: 30px; height: 30px; border-radius: 8px; cursor: pointer; font-size: 13px; }
    .msg table { border-collapse: collapse; width: 100%; }
    .msg th, .msg td { border: 1px solid #33415c; padding: 6px 8px; }
    .msg img { max-width: 100%; border-radius: 8px; }
    /* --- Markdown --- */
    .msg.md :first-child { margin-top: 0; }
    .msg.md :last-child { margin-bottom: 0; }
    .msg.md h1, .msg.md h2, .msg.md h3, .msg.md h4 { line-height: 1.3; margin: 12px 0 6px; font-weight: 700; }
    .msg.md h1 { font-size: 1.3em; }
    .msg.md h2 { font-size: 1.18em; }
    .msg.md h3 { font-size: 1.06em; }
    .msg.md p { margin: 6px 0; }
    .msg.md ul, .msg.md ol { margin: 6px 0; padding-left: 22px; }
    .msg.md li { margin: 2px 0; }
    .msg.md a { color: #6fb6ff; text-decoration: underline; word-break: break-word; }
    .msg.md blockquote { margin: 6px 0; padding: 4px 12px; border-left: 3px solid #33415c; color: var(--muted); }
    .msg.md del { opacity: .7; }
    .msg.md img { display: block; max-width: 100%; border-radius: 8px; margin: 6px 0; }
    .msg.md .math { font-family: "Cambria Math", "Latin Modern Math", Gentium, "Segoe UI Symbol", "Noto Sans Symbols", ui-monospace, Consolas, monospace; background: rgba(43,58,79,.45); padding: 1px 5px; border-radius: 4px; white-space: pre-wrap; font-style: italic; }
    .msg.md hr { border: 0; border-top: 1px solid #33415c; margin: 10px 0; }
    .msg.md code { background: #0b0f14; padding: 1px 5px; border-radius: 4px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .92em; }
    .msg.md pre { background: #0b0f14; padding: 10px; border-radius: 8px; overflow: auto; }
    .msg.md pre code { background: transparent; padding: 0; }
    .msg .upimg { display: block; max-width: 220px; max-height: 220px; margin: 4px 0; border-radius: 8px; }
    .stats { font-size: 12px; color: var(--muted); margin-top: 6px; white-space: pre-wrap; }
    #attach { flex: 0 0 auto; display: none; align-items: center; gap: 8px; padding: 8px 12px; background: var(--panel); border-top: 1px solid #33415c; }
    #attach img { height: 48px; border-radius: 6px; }
    .attach-rm { border: 0; background: #7a3a3a; color: #fff; width: 26px; height: 26px; border-radius: 50%; cursor: pointer; }
    #bar { flex: 0 0 auto; display: flex; gap: 8px; padding: 10px; background: var(--panel); border-top: 1px solid #33415c; }
    #bar input { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #33415c; background: var(--bg); color: var(--text); }
    #bar button { padding: 10px 16px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; }
    #bar .iconbtn { padding: 10px 12px; }
    #vision { font-size: 11px; color: #d6a04a; padding: 0 12px 6px; background: var(--panel); display: none; }
    #devbar { flex: 0 0 auto; display: none; flex-direction: column; gap: 8px; padding: 10px; background: #2a1c1c; border-bottom: 1px solid #5a2a2a; }
    #devbar small { color: #d6a0a0; font-size: 11px; }
    #devbar .devrow { display: flex; gap: 8px; }
    #devbar input { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #5a2a2a; background: var(--bg); color: var(--text); }
    #devbar button { padding: 10px 16px; border: 0; border-radius: 10px; background: #7a3a3a; color: #fff; }
    #gear { border: 0; background: transparent; color: var(--text); font-size: 18px; cursor: pointer; padding: 2px 6px; }
    #settings { flex: 1 1 auto; display: none; padding: 16px; flex-direction: column; gap: 12px; overflow-y: auto; }
    #settings .row { display: flex; flex-direction: column; gap: 4px; }
    #settings label { font-size: 12px; color: var(--muted); }
    #settings input, #settings select, #settings textarea { padding: 10px; border-radius: 10px; border: 1px solid #33415c; background: var(--bg); color: var(--text); font: inherit; }
    #settings textarea { min-height: 80px; resize: vertical; }
    #settings .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    #settings .actions button { padding: 10px 18px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; }
    #settings .ghost { background: #2a3a4f !important; }
    #s_status { font-size: 12px; color: #6fcf7f; }
    .savedkey { display: flex; gap: 6px; }
    .savedkey input { flex: 1; }
    .savedkey button { padding: 8px 10px; border: 0; border-radius: 8px; background: #2a3a4f; color: #fff; cursor: pointer; }
    #key_status { font-size: 11px; color: var(--muted); }
    .provkeys { display: flex; flex-direction: column; gap: 6px; }
    .pkrow { display: flex; gap: 6px; align-items: center; }
    .pkrow input { flex: 1; }
    .pkstatus { font-size: 11px; color: var(--muted); min-width: 96px; }
    /* --- Model Browser --- */
    #modelBrowser { flex: 1 1 auto; display: none; flex-direction: column; overflow: hidden; }
    #modelBrowser.open { display: flex; }
    .mb-top { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 16px; background: var(--accent); }
    .mb-top b { font-size: 15px; }
    .mb-top .hbtn { border: 0; background: transparent; color: var(--text); font-size: 20px; cursor: pointer; padding: 0 6px; }
    .mb-search { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--panel); border-bottom: 1px solid #33415c; }
    .mb-search input { flex: 1; padding: 10px 12px; border-radius: 10px; border: 1px solid #33415c; background: var(--bg); color: var(--text); }
    .mb-search .fbtn { border: 0; background: #2a3a4f; color: #fff; width: 40px; height: 40px; border-radius: 10px; cursor: pointer; font-size: 16px; }
    .mb-detail { flex: 0 0 auto; margin: 10px 12px; padding: 14px; background: linear-gradient(180deg, #1c2a3e, #16202e); border: 1px solid #2c3e57; border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,.35); }
    .mb-detail .dhead { display: flex; align-items: flex-start; gap: 8px; }
    .mb-detail .dname { font-size: 15px; font-weight: 700; line-height: 1.3; flex: 1; }
    .mb-star { border: 0; background: transparent; font-size: 20px; cursor: pointer; color: #6b7787; padding: 0 2px; }
    .mb-star.on { color: #ffce4d; }
    .mb-badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
    .badge { font-size: 11px; padding: 2px 9px; border-radius: 999px; background: #2a3a4f; color: var(--muted); }
    .badge.free { background: #1f5b3a; color: #8ff0b6; }
    .badge.paid { background: #5b3a1f; color: #f0e08f; }
    .badge.prov { background: #243a5e; color: #9fc6ff; }
    .badge.warn { background: #5b4a1f; color: #f0e08f; }
    .mb-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px 10px; margin: 8px 0; font-size: 12px; }
    .mb-grid .gk { color: var(--muted); }
    .mb-grid .gv { color: var(--text); text-align: right; }
    .mb-tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
    .mb-desc { font-size: 12px; color: var(--muted); line-height: 1.5; margin-top: 6px; }
    .mb-desc.mb-desc-hidden { display: none; }
    .mb-desc-toggle { background: none; border: 0; color: #6fb6ff; cursor: pointer; font: inherit; font-size: 12px; padding: 4px 0 0; }
    .mb-pick { margin-top: 10px; width: 100%; padding: 10px; border: 0; border-radius: 10px; background: #2563eb; color: #fff; font-weight: 700; cursor: pointer; }
    .mb-pick:disabled { background: #2a3a4f; color: var(--muted); cursor: default; }
    .mb-list { flex: 1 1 auto; overflow-y: auto; padding: 0 12px 14px; }
    .mb-group { margin-top: 8px; border: 1px solid #243042; border-radius: 12px; overflow: hidden; background: var(--panel); }
    .mb-group > .ghead { display: flex; align-items: center; gap: 8px; padding: 11px 12px; cursor: pointer; font-weight: 600; font-size: 13px; user-select: none; }
    .mb-group > .ghead .tri { transition: transform .15s; color: var(--muted); }
    .mb-group.collapsed > .ghead .tri { transform: rotate(-90deg); }
    .mb-group > .ghead .cnt { margin-left: auto; color: var(--muted); font-weight: 400; font-size: 12px; }
    .mb-group .gbody { display: block; }
    .mb-group.collapsed .gbody { display: none; }
    .mb-item { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-top: 1px solid #243042; cursor: pointer; }
    .mb-item:hover { background: #16202e; }
    .mb-item.selected { background: #1a2740; }
    .mb-item.active { background: #16263d; }
    .mb-item .iname { flex: 1; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mb-item .istar { font-size: 14px; color: #6b7787; }
    .mb-item .istar.on { color: #ffce4d; }
    .mb-item .ibadges { display: flex; gap: 4px; flex: 0 0 auto; }
    .mb-mini { font-size: 10px; padding: 1px 6px; border-radius: 999px; background: #1f5b3a; color: #8ff0b6; }
    .mb-empty { color: var(--muted); font-size: 12px; padding: 14px 12px; text-align: center; }
    .mb-loading { color: var(--muted); font-size: 12px; padding: 12px; }
    .ghead .ping-btn { border: 0; background: #2a3a4f; color: #8ff0b6; font-size: 11px; padding: 2px 8px; border-radius: 6px; cursor: pointer; margin-left: 8px; }
    .ghead .ping-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .ghead .ping-time { font-size: 11px; color: var(--muted); margin-left: 8px; }
    /* --- Lightbox для фото --- */
    #lightbox { position: fixed; inset: 0; z-index: 10000; display: none; align-items: center; justify-content: center;
                background: rgba(0,0,0,.85); padding: 16px; flex-direction: column; gap: 12px; }
    #lightbox.open { display: flex; }
    #lightbox img { max-width: 100%; max-height: 70vh; border-radius: 10px; object-fit: contain; }
    #lightbox .lb-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    #lightbox .lb-actions button { padding: 10px 16px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
    #lightbox .lb-actions .lb-reply { background: #2563eb; }
    #lightbox .lb-close { position: absolute; top: 12px; right: 12px; width: 40px; height: 40px; border: 0;
                  border-radius: 50%; background: rgba(255,255,255,.15); color: #fff; font-size: 20px; cursor: pointer; }
  </style>

  <header>
    <b>🤖 AI App</b>
    <span id="log">инициализация...</span>
    <button id="theme" class="hbtn" title="Тема">☀️</button>
    <button id="models" title="Браузер моделей" aria-label="Браузер моделей">
      <svg class="model-svg" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="msGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#4fc3ff"/>
            <stop offset="0.5" stop-color="#7c5cff"/>

          </linearGradient>
        </defs>
        <circle class="ms-pulse" cx="16" cy="16" r="13"/>
        <circle class="ms-ring" cx="16" cy="16" r="14"/>
        <g class="ms-links">
          <line class="ms-link" x1="16" y1="16" x2="9" y2="10"/>
          <line class="ms-link" x1="16" y1="16" x2="23" y2="10"/>
          <line class="ms-link" x1="16" y1="16" x2="9" y2="22"/>
          <line class="ms-link" x1="16" y1="16" x2="23" y2="22"/>
          <line class="ms-link" x1="9" y1="10" x2="23" y2="10"/>
          <line class="ms-link" x1="9" y1="22" x2="23" y2="22"/>

        <g class="ms-nodes">

          <circle class="ms-node" cx="23" cy="10" r="2.4"/>
          <circle class="ms-node" cx="9" cy="22" r="2.4"/>

        <circle class="ms-core" cx="16" cy="16" r="4.5"/>
      </svg>
    </button>
    <button id="gear" title="Настройки">⚙</button>
  </header>

  <div id="devbar" style="display:none">
    <small>Локальный режим (WEB_APP_DEV). Данные администратора подтягиваются автоматически с вашего устройства.</small>
  </div>

  <div id="settings">
    <div class="row">
      <label>Ключи провайдеров (каждый — отдельно)</label>
      <div id="s_keys" class="provkeys"></div>
    </div>
    <div class="row">
      <label>Системный промпт</label>
      <textarea id="s_prompt"></textarea>
    </div>
    <div class="row">
      <label>Лимит контекста (сообщений)</label>
      <select id="s_limit">
        <option value="5">5</option>
        <option value="10">10</option>
        <option value="20">20</option>
        <option value="50">50</option>
        <option value="100">100</option>
      </select>
    </div>
    <div class="row">
      <label>Статистика токенов</label>
      <select id="s_stats">
        <option value="disabled">выкл</option>
        <option value="compact">компакт</option>
        <option value="full">полная</option>
      </select>
    </div>
    <div class="actions">
      <button id="s_save">Сохранить</button>
      <button id="s_clear" class="ghost" type="button">🗑 Очистить историю</button>
      <button id="s_pwa" class="ghost" type="button">📲 PWA</button>
      <button id="s_web" class="ghost" type="button">🌐 Открыть в браузере</button>
      <a id="s_admin" class="ghost" href="admin.html" style="display:none">🛠 Админ-панель</a>
      <span id="s_status"></span>
    </div>
  </div>

  <div id="modelBrowser">
    <div class="mb-top">
      <b>🧠 Браузер моделей</b>
    </div>
    <div class="mb-search">
      <input id="mb_search" placeholder="Поиск моделей" />
      <button class="fbtn" id="mb_filter" title="Фильтры">⚙️</button>
    </div>
    <div class="mb-detail" id="mb_detail">
      <div class="mb-empty">Выбери модель из списка, чтобы увидеть подробности.</div>
    </div>

  <div id="messages"></div>

  <form id="bar" autocomplete="off">
    <input id="imgfile" type="file" accept="image/*" capture="environment" style="display:none" />
    <button id="imgbtn" type="button" class="iconbtn" title="Прикрепить фото">📷</button>
    <input id="input" placeholder="Сообщение или фото..." />
    <button type="submit">➤</button>
  </form>

  <script src="/sw-register.js"></script>
  <script>
    window.addEventListener("error", (e) => {
      try { const el = document.querySelector("#log"); if (el) el.textContent = "JS ошибка: " + (e.message || e.error || e); } catch (_) {}
      try { alert("JS ошибка: " + (e.message || e.error || e)); } catch (_) {}
    });
    const $ = (s) => document.querySelector(s);
    const log = (t) => { $("#log").textContent = t; };
    document.body.setAttribute("data-ran", "1");
    log("загрузка…");

    // Базовый URL Edge Functions Supabase. Формат:
    //   https://<PROJECT_REF>.supabase.co/functions/v1
    // Можно переопределить через ?api= или localStorage("api_base").
    // По умолчанию — вшитый адрес (меняется при деплое).
    const DEFAULT_FN_BASE = "https://amhszfvqruzpydqyjlya.supabase.co/functions/v1";
    function resolveFnBase() {
      try {
        const fromUrl = new URLSearchParams(location.search).get("api");
        if (fromUrl) return fromUrl.replace(/\/+$/, "");
      } catch (e) {}
      return DEFAULT_FN_BASE;
    }
    const FN_BASE = resolveFnBase();
    // POST в Edge Function с авторизацией.
    async function ef(name, body, ms = 20000) {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), ms);
      try {
        return await fetch(FN_BASE + "/" + name, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(Object.assign(authBody(), body || {})),
          signal: ctrl.signal,
        });
      } finally {
        clearTimeout(t);
      }
    }
    const box = $("#messages");
    const PROVIDER_LABELS = { openrouter: "OpenRouter", openai: "OpenAI", gemini: "Gemini", groq: "Groq", venice: "Venice AI" };

    let currentUserId = "";
    let currentModelId = "";
    let isAdmin = false;
    let pendingImage = null;

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    const esc = escapeHtml;

    // --- Markdown rendering (через marked + санитайзер) -------------------
    // marked грузится из /marked.min.js (тот же origin, без внешнего CDN).
    // marked умеет таблицы/списки/заголовки/зачёркивание(gfm)/картинки/код.
    // Математика $...$ / $$...$$ — пре-процессим в <code class="math"> (без
    // внешних библиотек, чтобы не ломать офлайн/VPN). Настоящий LaTeX = KaTeX.
    function safeUrl(u) {
      const t = String(u).trim();
      if (/^(https?:|mailto:|\/|#)/i.test(t)) return t;
      if (/^data:image\//i.test(t)) return t;
      return "#";
    }
    // Проксируем внешние картинки через наш Edge Function (Telegram WebApp
    // блокирует многие внешние домены). data: оставляем как есть.
    function imgProxyUrl(u) {
      const t = String(u).trim();
      if (/^data:/i.test(t)) return t;
      if (/^https?:\/\//i.test(t)) {
        try { return FN_BASE + "/img-proxy?u=" + encodeURIComponent(t); } catch (_) { return t; }
      }
      return "#";
    }
    const MD_ALLOWED_TAGS = new Set([
      "H1","H2","H3","H4","P","BR","HR","STRONG","EM","DEL","CODE","PRE","BLOCKQUOTE",
      "UL","OL","LI","A","IMG","TABLE","THEAD","TBODY","TR","TH","TD","SPAN"
    ]);
    // Regex-сантитайзер без DOMParser (работает в любом WebView, не падает).
    function sanitizeMdHtml(htmlStr) {
      // 1) удаляем теги вне allowlist
      htmlStr = htmlStr.replace(/<\/?([A-Z][A-Z0-9]*)\b[^>]*>/gi, (m, tag) => {
        if (MD_ALLOWED_TAGS.has(tag.toUpperCase())) return m;
        return ""; // тег не в allowlist -> вырезаем целиком
      });
      // 2) чистим атрибуты внутри разрешённых тегов
      htmlStr = htmlStr.replace(/<([A-Z][A-Z0-9]*)\b([^>]*)>/gi, (m, tag, attrs) => {
        const uTag = tag.toUpperCase();
        if (!MD_ALLOWED_TAGS.has(uTag)) return m; // не должно случиться, но на всякий
        // парсим атрибуты regex'ом
        let outAttrs = "";
        attrs.replace(/(\w+)\s*=\s*(?:"([^"]*)"|'([^']*)'|(\S+))/g, (_, name, v1, v2, v3) => {
          const val = (v1 !== undefined ? v1 : v2 !== undefined ? v2 : v3 || "").trim();
          const ln = name.toLowerCase();
          // опасные атрибуты: on*, javascript: в href/src
          if (/^on/i.test(ln)) return;
          if ((ln === "href" || ln === "src") && /^javascript:/i.test(val)) return;
          if (uTag === "A") {
            if (ln === "href") {
              const v = safeUrl(val);
              if (v === "#") return;
              outAttrs += ` href="${v}" target="_blank" rel="noopener noreferrer"`;
            }
          } else if (uTag === "IMG") {
            if (ln === "src") {
              const v = imgProxyUrl(val);
              if (v === "#") return;
              outAttrs += ` src="${v}"`;
            } else if (ln === "alt") {
              outAttrs += ` alt="${val.replace(/"/g, '"')}"`;
            }
          } else if (ln === "class") {
            outAttrs += ` class="${val.replace(/"/g, '"')}"`;
          }
        });
        return `<${tag}${outAttrs}>`;
      });
      // 3) комментарии
      htmlStr = htmlStr.replace(/<!--[\s\S]*?-->/g, "");
      return htmlStr;
    }
    // --- Лёгкий рендер математики (без внешних библиотек, offline).
    // Поддерживает: ^верхний, _нижний, \frac{a}{b}, \sqrt{x}, \cdot \times
    // \pm \leq \geq \neq \approx, греческие буквы, \left( \right).
    const MATH_GREEK = {
      alpha:"α",beta:"β",gamma:"γ",delta:"δ",epsilon:"ε",zeta:"ζ",eta:"η",
      theta:"θ",iota:"ι",kappa:"κ",lambda:"λ",mu:"μ",nu:"ν",xi:"ξ",pi:"π",
      rho:"ρ",sigma:"σ",tau:"τ",upsilon:"υ",phi:"φ",chi:"χ",psi:"ψ",omega:"ω",
      Gamma:"Γ",Delta:"Δ",Theta:"Θ",Lambda:"Λ",Xi:"Ξ",Pi:"Π",Sigma:"Σ",
      Phi:"Φ",Psi:"Ψ",Omega:"Ω"
    };
    const MATH_SYM = {
      cdot:"·",times:"×",pm:"±",mp:"∓",leq:"≤",geq:"≥",neq:"≠",approx:"≈",
      equiv:"≡",propto:"∝",infty:"∞",partial:"∂",nabla:"∇",sum:"∑",prod:"∏",
      int:"∫",oint:"∮",cup:"∪",cap:"∩",in:"∈",notin:"∉",subset:"⊂",
      supset:"⊃",emptyset:"∅",forall:"∀",exists:"∃",nabla:"∇",angle:"∠",
      perp:"⊥",parallel:"∥",rightarrow:"→",leftarrow:"←",Rightarrow:"⇒",
      Leftarrow:"⇐",leftrightarrow:"↔",Leftrightarrow:"⇔",to:"→",mapsto:"↦",
      dots:"…",ldots:"…",cdots:"⋯",vdots:"⋮",ddots:"⋱",quad:" ",qquad:" ",
      space:" ",deg:"°",circ:"∘",star:"⋆",ast:"∗",oplus:"⊕",otimes:"⊗",
      ell:"ℓ",Re:"ℜ",Im:"ℑ",aleph:"ℵ",hbar:"ℏ",nabla:"∇",prime:"′",
      langle:"⟨",rangle:"⟩",lfloor:"⌊",rfloor:"⌋",lceil:"⌈",rceil:"⌉"
    };
    function renderMathAtom(s) {
      if (!s) return "";
      s = s.replace(/\\left|\\right|\\bigl|\\bigr|\\Big|\\big/g, "");
      s = s.replace(/\\(frac|dfrac|tfrac)\s*\{([^{}]*)\}\s*\{([^{}]*)\}/g, "$1⁄$2");
      s = s.replace(/\\sqrt\s*\{([^{}]*)\}/g, "√$1");
      s = s.replace(/\\sqrt\s*([a-zA-Z0-9])/g, "√$1");
      s = s.replace(/\\(left|right)?[()\[\]]/g, (m) => m.includes("[") ? "[" : m.includes("]") ? "]" : m.includes("(") ? "(" : ")");
      s = s.replace(/\\(cdot|times|pm|mp|leq|geq|neq|approx|equiv|propto|infty|partial|nabla|sum|prod|int|oint|cup|cap|in|notin|subset|supset|emptyset|forall|exists|angle|perp|parallel|rightarrow|leftarrow|Rightarrow|Leftarrow|leftrightarrow|Leftrightarrow|to|mapsto|dots|ldots|cdots|vdots|ddots|quad|qquad|space|deg|circ|star|ast|oplus|otimes|ell|Re|Im|aleph|hbar|prime|langle|rangle|lfloor|rfloor|lceil|rceil)/g,
        (_, n) => MATH_SYM[n] || n);
      s = s.replace(/\\(alpha|beta|gamma|delta|epsilon|zeta|eta|theta|iota|kappa|lambda|mu|nu|xi|pi|rho|sigma|tau|upsilon|phi|chi|psi|omega|Gamma|Delta|Theta|Lambda|Xi|Pi|Sigma|Phi|Psi|Omega)/g,
        (_, n) => MATH_GREEK[n] || n);
      s = s.replace(/\\([a-zA-Z]+)/g, "$1");
      return s;
    }
    function supUni(ch) {
      const map = {"0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹",
        "a":"ᵃ","b":"ᵇ","c":"ᶜ","d":"ᵈ","e":"ᵉ","f":"ᶠ","g":"ᵍ","h":"ʰ","i":"ⁱ","j":"ʲ","k":"ᵏ",
        "l":"ˡ","m":"ᵐ","n":"ⁿ","o":"ᵒ","p":"ᵖ","r":"ʳ","s":"ˢ","t":"ᵗ","u":"ᵘ","v":"ᵛ","w":"ʷ",
        "x":"ˣ","y":"ʸ","z":"ᶻ","+":"⁺","-":"⁻","=":"⁼","(":"⁽",")":"⁾"};
      return map[ch] || ch;
    }
    function subUni(ch) {
      const map = {"0":"₀","1":"₁","2":"₂","3":"₃","4":"₄","5":"₅","6":"₆","7":"₇","8":"₈","9":"₉",
        "a":"ₐ","e":"ₑ","h":"ₕ","i":"ᵢ","j":"ⱼ","k":"ₖ","l":"ₗ","m":"ₘ","n":"ₙ","o":"ₒ","p":"ₚ",
        "r":"ᵣ","s":"ₛ","t":"ₜ","u":"ᵤ","v":"ᵥ","x":"ₓ","+":"₊","-":"₋","=":"₌","(":"₍",")":"₎"};
      return map[ch] || ch;
    }
    function toSup(str) { return String(str).split("").map(supUni).join(""); }
    function toSub(str) { return String(str).split("").map(subUni).join(""); }
    function readGroup(s, i) {
      // читает { ... } или один символ, возвращает [text, newIndex]
      if (s[i] === "{") {
        let d = 1, j = i + 1, g = "";
        while (j < s.length && d > 0) {
          if (s[j] === "{") d++;
          else if (s[j] === "}") { d--; if (d === 0) { j++; break; } }
          g += s[j]; j++;
        }
        return [g, j];
      }
      return [s[i] || "", i + 1];
    }
    function renderMathInner(s) {
      // Сначала препроцессим греческие буквы и символы (они без групп).
      s = s.replace(/\\(alpha|beta|gamma|delta|epsilon|zeta|eta|theta|iota|kappa|lambda|mu|nu|xi|pi|rho|sigma|tau|upsilon|phi|chi|psi|omega|Gamma|Delta|Theta|Lambda|Xi|Pi|Sigma|Phi|Psi|Omega)/g,
        (_, n) => MATH_GREEK[n] || n);
      s = s.replace(/\\(cdot|times|pm|mp|leq|geq|neq|approx|equiv|propto|infty|partial|nabla|sum|prod|int|oint|cup|cap|in|notin|subset|supset|emptyset|forall|exists|angle|perp|parallel|rightarrow|leftarrow|Rightarrow|Leftarrow|leftrightarrow|Leftrightarrow|to|mapsto|dots|ldots|cdots|vdots|ddots|quad|qquad|space|deg|circ|star|ast|oplus|otimes|ell|Re|Im|aleph|hbar|prime|langle|rangle|lfloor|rfloor|lceil|rceil)/g,
        (_, n) => MATH_SYM[n] || n);
      s = s.replace(/\\left|\\right|\\bigl|\\bigr|\\Big|\\big/g, "");
      s = s.replace(/\\(left|right)?[()\[\]]/g, (m) => m.includes("[") ? "[" : m.includes("]") ? "]" : m.includes("(") ? "(" : ")");
      let out = "";
      let i = 0;
      while (i < s.length) {
        const c = s[i];
        // команда \cmd (с последующими группами)
        if (c === "\\") {
          let j = i + 1, name = "";
          while (j < s.length && /[a-zA-Z]/.test(s[j])) { name += s[j]; j++; }
          if (name === "frac" || name === "dfrac" || name === "tfrac") {
            const [a, k1] = readGroup(s, j);
            const [b, k2] = readGroup(s, k1);
            out += a + "⁄" + b;
            i = k2; continue;
          }
          if (name === "sqrt") {
            const [a, k1] = readGroup(s, j);
            out += "√" + renderMathInner(a);
            i = k1; continue;
          }
          if (name === "text" || name === "mathrm" || name === "mathbf" || name === "mathit" || name === "operatorname") {
            const [a, k1] = readGroup(s, j);
            out += renderMathInner(a);
            i = k1; continue;
          }
          // неизвестная команда -> убираем обратный слэш, оставляем имя
          out += name;
          i = j; continue;
        }
        if (c === "^" || c === "_") {
          const [grp, k] = readGroup(s, i + 1);
          out += (c === "^") ? toSup(renderMathInner(grp)) : toSub(renderMathInner(grp));
          i = k; continue;
        }
        out += c;
        i++;
      }
      return out;
    }
    function renderMath(src) {
      const isBlock = src.startsWith("$$") && src.endsWith("$$");
      const body = isBlock ? src.slice(2, -2) : (src.startsWith("$") && src.endsWith("$") ? src.slice(1, -1) : src);
      const html = renderMathInner(body.trim());
      return `<span class="math">${html}</span>`;
    }
    function renderMarkdown(src) {
      try {
        const text = String(src || "").replace(/\r\n/g, "\n");
        // 1) выносим математику в заглушки, чтобы marked не сломал
        const math = [];
        let pre = text
          .replace(/\$\$([\s\S]+?)\$\$/g, (_, f) => { math.push(renderMath("$$" + f.trim() + "$$")); return "\u0002M" + (math.length - 1) + "M\u0002"; })
          .replace(/(^|[^\\$])\$([^\$\n]+?)\$/g, (_, pre2, f) => { math.push(renderMath("$" + f.trim() + "$")); return pre2 + "\u0002M" + (math.length - 1) + "M\u0002"; });
        // 2) marked (gfm: таблицы/зачёркивание, breaks: переносы строк)
        let html = (typeof marked !== "undefined" && marked.parse)
          ? marked.parse(pre, { gfm: true, breaks: true })
          : "<p>" + esc(pre) + "</p>";
        // 3) санитайз (regex, без DOMParser)
        html = sanitizeMdHtml(html);
        // 4) возвращаем математику
        html = html.replace(/\u0002M(\d+)M\u0002/g, (_, i) => math[Number(i)] || "");
        return html;
      } catch (_) {
        // абсолютный фолбэк: просто экранируем + переносы строк
        return String(src || "").replace(/\r\n/g, "\n").split("\n").map(esc).join("<br>");
      }
    }

    function addCodeCopy(root) {
      root.querySelectorAll("pre").forEach((pre) => {
        if (pre.parentElement && pre.parentElement.classList.contains("code-wrap")) return;
        const wrap = document.createElement("div");
        wrap.className = "code-wrap";
        pre.parentNode.insertBefore(wrap, pre);
        wrap.appendChild(pre);
        const btn = document.createElement("button");
        btn.className = "code-copy";
        btn.textContent = "📋";
        btn.title = "Копировать";
        btn.addEventListener("click", () => {
          const code = pre.querySelector("code");
          const txt = code ? code.innerText : pre.innerText;
          navigator.clipboard.writeText(txt).then(() => {
            btn.textContent = "✅";
            setTimeout(() => (btn.textContent = "📋"), 1200);
          }).catch(() => {});
        });
        wrap.appendChild(btn);
    });

      addMessage("user", userHtml + imgHtml);

      const imageToSend = pendingImage ? pendingImage.dataUrl : null;
      input.value = "";
      pendingImage = null;
      showAttach();

      try {
        const res = await ef("chat", { message: text, image: imageToSend }, 300000);
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          addMessage("bot", escapeHtml(data.error || ("ошибка " + res.status)));
          return;
        }
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = "", botEl = null, botText = null, full = "";
        const flushLine = async (line) => {
          if (!line.trim()) return;
          let ev;
          try { ev = JSON.parse(line); } catch { return; }
          if (ev.type === "start") {
            botEl = document.createElement("div");
            botEl.className = "msg bot md";
            botText = document.createElement("div");
            botText.className = "md";
            botEl.appendChild(botText);
            box.appendChild(botEl);
          } else if (ev.type === "delta") {
            full += ev.text || "";
            // Во время стрима — только плоский текст (без Markdown), чтобы
            // не ломать таблицы/картинки и не терять пробелы. Полный рендер —
            // один раз на result по готовому markdown.
            if (botText) botText.textContent = full;
            box.scrollTop = box.scrollHeight;
          } else if (ev.type === "error") {
            if (botEl) botEl.remove();
            addMessage("bot", escapeHtml(ev.message || "ошибка"));
          } else if (ev.type === "result") {
            if (botText) {
              try { botText.innerHTML = renderMarkdown(ev.markdown || full); }
              catch (_) { botText.textContent = ev.markdown || full; }
            }
            if (ev.stats) {
              const s = document.createElement("div");
              s.className = "stats";
              s.textContent = ev.stats;
              botEl.appendChild(s);
            }
            if (botEl) addCodeCopy(botEl);
            box.scrollTop = box.scrollHeight;
          }
        };
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          let nl;
          while ((nl = buf.indexOf("\n")) >= 0) {
            const line = buf.slice(0, nl);
            buf = buf.slice(nl + 1);
            await flushLine(line);
          }
        }
        if (buf) await flushLine(buf);
      } catch (err) {
        addMessage("bot", "⚠️ " + escapeHtml(String(err)));
      }
    });

    function mbPingStoreKey() { return "mb_ping_" + (currentUserId || "anon"); }

    // Клиентский кеш списка моделей (чтобы не грузить 170КБ+ при каждом открытии).

    function mbCacheKey(p) { return "mb_list_" + MB_CACHE_VER + "_" + p + "_" + (currentUserId || "anon"); }

      if (l.startsWith("groq:")) return "groq";

    function mbFmtCtx(c) {

    function mbFmtPrice(p, unit) {
      if (!p || p === "Free") return "—";

      // Venice (price_unit="per_1m") уже отдаёт цену за 1M токенов -> как есть.
      const perM = unit === "per_1m" ? n : n * 1000000;
      if (perM <= 0) return "—";
      return "$" + (perM < 1 ? perM.toFixed(4) : perM.toFixed(2)) + " / 1M";
    }
    function mbFmtPing(ts) {

        overlay.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px;";
        const box = document.createElement("div");
        box.style.cssText = "background:var(--panel);border:1px solid #33415c;border-radius:14px;max-width:320px;width:100%;padding:18px;display:flex;flex-direction:column;gap:14px;";
        const msg = document.createElement("div");
        msg.style.cssText = "font-size:13px;line-height:1.5;color:var(--text);white-space:pre-line;";
        msg.textContent = message;
        const row = document.createElement("div");
        row.style.cssText = "display:flex;gap:10px;";
        const cancel = document.createElement("button");
        cancel.textContent = cancelLabel || "Отмена";
        cancel.style.cssText = "flex:1;padding:10px;border:0;border-radius:10px;background:#2a3a4f;color:#fff;cursor:pointer;";
        const confirm = document.createElement("button");
        confirm.textContent = okLabel || "Продолжить";
        confirm.style.cssText = "flex:1;padding:10px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer;";
        const close = (val) => { overlay.remove(); resolve(val); };
        cancel.addEventListener("click", () => close(false));
        confirm.addEventListener("click", () => close(true));
        row.appendChild(cancel);
        row.appendChild(confirm);
        box.appendChild(msg);
        box.appendChild(row);
        overlay.appendChild(box);
        document.body.appendChild(overlay);
      });
    }
    function mbToggle() {
      if ($("#modelBrowser").classList.contains("open")) mbClose();
      else mbOpen();
    }
    $("#models").addEventListener("click", mbToggle);
    // вспышка-пульс при нажатии на иконку модели
    $("#models").addEventListener("pointerdown", () => {
      const b = $("#models");
      b.classList.remove("ping");
      void b.offsetWidth; // перезапуск анимации
      b.classList.add("ping");
    });
    $("#mb_filter").addEventListener("click", () => log("⚙️ Фильтры появятся позже"));
    $("#mb_search").addEventListener("input", (e) => { mbState.search = e.target.value; mbRenderList(); });
    $("#mb_list").addEventListener("click", async (e) => {
      const pingBtn = e.target.closest("[data-ping]");
      if (pingBtn) { await mbPingGroup(pingBtn.dataset.ping); return; }
      const toggle = e.target.closest("[data-desctoggle]");
      if (toggle) {
        e.stopPropagation();
        const desc = toggle.previousElementSibling;
        if (desc && desc.hasAttribute("data-desc")) {
          const expanded = desc.classList.toggle("clamped") === false;
          toggle.textContent = expanded ? "Свернуть описание ▴" : "Развернуть описание ▾";
        }
        return;
      }
      const head = e.target.closest(".ghead");
      if (head) { const g = head.parentElement; mbState.collapsed[g.dataset.group] = !mbState.collapsed[g.dataset.group]; await mbRenderList(); return; }
      const item = e.target.closest(".mb-item");
      if (item) { await mbSelect(item.dataset.id); }
    });
    $("#mb_detail").addEventListener("click", async (e) => {
      const toggle = e.target.closest("[data-desctoggle]");
      if (toggle) {
        e.stopPropagation();
        const desc = toggle.previousElementSibling;
        if (desc && desc.hasAttribute("data-desc")) {
          const hidden = desc.classList.toggle("mb-desc-hidden");
          toggle.textContent = hidden ? "Показать описание ▾" : "Скрыть описание ▴";
        }
        return;
      }
      const star = e.target.closest("[data-star]");
      if (star) { e.stopPropagation(); await mbToggleFav(star.dataset.star); return; }
      const pick = e.target.closest("[data-pick]");
      if (pick) { e.stopPropagation(); await mbPick(pick.dataset.pick); }
    });

    // --- Settings save / clear -------------------------------------------
    $("#s_save").addEventListener("click", async () => {
      const status = $("#s_status");
      status.textContent = "";
      const payload = Object.assign(authBody(), {
        selected_model: currentModelId,
        system_prompt: $("#s_prompt").value,
        context_limit: $("#s_limit").value,
        stats_display: $("#s_stats").value,
      });
      payload.provider_keys = collectProviderKeys();
      try {
        const res = await ef("settings", payload, 15000);
        const data = await res.json();
        if (!data.ok) { status.style.color = "#e06b6b"; status.textContent = data.error || "ошибка"; return; }
        status.style.color = "#6fcf7f";
        status.textContent = "сохранено ✔";
        PROVIDERS.forEach((p) => { $("#s_key_" + p).value = ""; });
        log("модель: " + data.settings.selected_model);
        loadKeyInfo();
      } catch (err) {
        status.style.color = "#e06b6b";
        status.textContent = "⚠️ " + String(err);
      }
    });

    $("#s_clear").addEventListener("click", async () => {
      if (!confirm("Очистить всю историю переписки?")) return;
      const status = $("#s_status");
      try {
        const res = await ef("chat-clear", {}, 15000);
        const data = await res.json();
        status.style.color = data.ok ? "#6fcf7f" : "#e06b6b";
        status.textContent = data.ok ? "история очищена ✔" : (data.error || "ошибка");
        if (data.ok) box.innerHTML = "";
      } catch (err) {
        status.style.color = "#e06b6b";
        status.textContent = "⚠️ " + String(err);
      }
    });

    $("#s_pwa").addEventListener("click", async () => {
      const status = $("#s_status");
      const say = (txt, color) => { status.style.color = color; status.textContent = txt; };
      try {
        if (window.matchMedia("(display-mode: standalone)").matches) {
          say("уже запущено как приложение ✔", "#6fcf7f");
          return;
        }
        if (inTelegram) {
          // PWA не ставится из WebView — выходим в системный браузер,
          // передавая init_data, чтобы веб-версия сразу авторизовалась.
          const initData = currentInitData();
          const base = location.origin + location.pathname;
          const url = initData ? base + "?init_data=" + encodeURIComponent(initData) : base;
          if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openLink) {
            window.Telegram.WebApp.openLink(url);
            say("открываю браузер для установки PWA…", "#6fcf7f");
          } else {
            window.open(url, "_blank");
          }
          return;
        }
        if (window.deferredPrompt) {
          window.deferredPrompt.prompt();
          const { outcome } = await window.deferredPrompt.userChoice;
          say(outcome === "accepted" ? "установка начата ✔" : "отменено", outcome === "accepted" ? "#6fcf7f" : "#e0a96b");
          window.deferredPrompt = null;
          return;
        }
        const problems = [];
        if (!window.isSecureContext) problems.push("не защищённый контекст (нужен HTTPS или localhost)");
        if (!("serviceWorker" in navigator)) problems.push("браузер не поддерживает Service Worker (PWA временно отключена для отладки туннеля)");
        try {
          const mt = await fetch("/manifest.webmanifest").then((r) => r.text());
          let m = null;
          try { m = JSON.parse(mt); } catch (_) { m = null; }
          if (!m || !m.icons || !m.icons.length) problems.push("manifest недоступен (возможно туннель блокирует запрос)");
        } catch (e) { problems.push("не удалось загрузить manifest.webmanifest"); }
        if (problems.length) say("PWA недоступна: " + problems.join("; "), "#e0a96b");
        else say("Браузер пока не предложил установку — перезагрузите страницу (Ctrl+Shift+R) и нажмите PWA снова.", "#e0a96b");
      } catch (err) {
        say("⚠️ " + String(err), "#e06b6b");
      }
    });

    // --- Gear / dev login ------------------------------------------------
    function openSettings() {
      mbClose();
      $("#settings").style.display = "flex";
      $("#messages").style.display = "none";
      $("#attach").style.display = "none";
      $("#vision").style.display = "none";
      $("#bar").style.display = "none";
      loadKeyInfo();
    }
    function closeSettings() {
      $("#settings").style.display = "none";
      $("#messages").style.display = "";
      $("#attach").style.display = "";
      $("#vision").style.display = "";
      $("#bar").style.display = "";
    }
    $("#gear").addEventListener("click", () => {
      if ($("#settings").style.display === "flex") closeSettings();
      else openSettings();
    });
    async function tryAutoAdmin() {
      // Dev-режим на локальной машине: пробуем зайти под dev_user.
      const devId = getDevId();
      if (devId) {
        if (await auth(devId)) { $("#devbar").style.display = "none"; return; }
      }
      $("#devbar").style.display = "flex";
    }

    (async () => {
      try {
        buildKeyRows();
        if (inTelegram) {
          // Внутри Telegram ID пользователя подтягивается автоматически из initData.
          await auth("");
        } else {
          await tryAutoAdmin();
        }
      } catch (e) {
        log("⚠️ ошибка инициализации: " + (e && e.message ? e.message : String(e)));
        console.error(e);
      }
    })();

    // Явно показываем чат после загрузки DOM (страховка от вечной заглушки).
    window.addEventListener("DOMContentLoaded", () => {
      setTimeout(() => {
        const lg = $("#log");
        if (lg && (lg.textContent === "инициализация..." || lg.textContent === "загрузка…")) {
          // auth ещё не отработал или упала — покажем подсказку
          log("⚠️ не удалось подключиться. Открой консоль (eruda) для деталей.");
        }
      }, 12000);
    });

    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      window.deferredPrompt = e;
    });
    window.addEventListener("appinstalled", () => { window.deferredPrompt = null; });
  </script>
  <!-- DEV ONLY: мобильная консоль отладки (eruda). Не удалять временно. -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>if (window.eruda) eruda.init();</script>
